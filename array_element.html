<h2>Array update and delete</h2>
<script>
    var a =["ayush",25,"computer","Software Developer","Pune"];
    document.write(a+"<br>");
    a[4]="mumbai";
    a[2]="apple";
        document.write(a+"<br>");
        //delete
        // delete a['computer'];
        delete a[2];
            document.write(a+"<br>");
</script>
<hr>

<h2>Sorting And Reverse</h2>
<script>
    var b = ['apple','gaurav','sumedh','shantanu','darshan','chakuli'];
    document.write(b + "<br>");
    b.sort();
    document.write(b + "<br>");
    b.reverse();
    document.write(b+ "<br>");
    
    
</script>


<hr>
<h3>Pop And Push MEthod</h3>
<script> 
 var c = ['apple','gaurav','sumedh','shantanu','darshan','chakuli'];
 c.pop();
 c.pop();
 document.write(c + "<br>");
 c.push('swapnil');
 c.push('ayush');
  document.write(c + "<br>");

  var p =c.join("/");
    document.write(p+ "<br>");

    


 </script>
 <hr>

 <br>
 <h2>Shift and Unshift</h2>
 <script>
 var d =['apple','gaurav','sumedh','shantanu','darshan','chakuli'];
 document.write(d+"<br>");
 d.shift();
  document.write(d+"<br>");
  d.unshift('sujal');
  d.unshift('swapnali');
  d.unshift('khushi');

   document.write(d+"<br>");
   var z=d.join("/");
   document.write(z+"<br>");


 </script>
 <hr>

<h2>concat and Join</h2>
<Script>
    var a=["shantanu","sumedh","mansoor","ashvini","pratiksha","swati"];
    var b=["gaurav","darshan","omkar"];
    var d=["ayush","sujal","Piyush"];
    var e =a.concat(b,d);
    document.write(e+"<br>");

    var x =e.join("/");
    document.write(x+"<br>");


</Script>
